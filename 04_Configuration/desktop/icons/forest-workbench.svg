<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="wbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2326"/>
      <stop offset="100%" stop-color="#2d353b"/>
    </linearGradient>
    <linearGradient id="wbAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7c080"/>
      <stop offset="50%" stop-color="#7fbbb3"/>
      <stop offset="100%" stop-color="#dbbc7f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#wbBg)" stroke="#7fbbb3" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Workstation screen frame -->
  <rect x="20" y="24" width="88" height="64" rx="8" fill="#181c1e" stroke="#a7c080" stroke-width="2"/>
  <!-- Display stand -->
  <polygon points="56,88 72,88 78,104 50,104" fill="#374247"/>
  <rect x="42" y="104" width="44" height="6" rx="3" fill="#a7c080"/>
  <!-- Screen internal graphs and canopy -->
  <polygon points="64,34 78,54 50,54" fill="#a7c080" opacity="0.9"/>
  <polygon points="64,44 84,68 44,68" fill="#83c092" opacity="0.8"/>
  <rect x="61" y="68" width="6" height="8" fill="#dbbc7f"/>
  <!-- Live telemetry sparkline on monitor -->
  <path d="M26,76 L38,72 L46,75 L54,68 L64,74 L74,66 L86,72 L100,64" fill="none" stroke="#7fbbb3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
